<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akrap</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#e8eef6;--card:#ffffff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--teal:#1e40af;--teal-ink:#fff;--soft:#dce6f4;--red:#b91c1c;--brass:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111827;--ink:#e5e7eb;--mute:#94a3b8;--line:#1f2937;--teal:#60a5fa;--teal-ink:#0b1220;--soft:#1e293b;--red:#f87171;--brass:#fbbf24}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111827;--ink:#e5e7eb;--mute:#94a3b8;--line:#1f2937;--teal:#60a5fa;--teal-ink:#0b1220;--soft:#1e293b;--red:#f87171;--brass:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
header#top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5;padding-top:env(safe-area-inset-top,0px)}
header#top:empty{display:none}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 6px}
.brand{font-weight:800;font-size:16px}
.who{font-size:13px;color:var(--mute);white-space:nowrap}
.who a{color:var(--teal);text-decoration:none;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}
nav button{width:auto;margin:0;flex:none;background:var(--card);color:var(--mute);border:1px solid var(--line);padding:6px 12px;font-size:14px}
nav button.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
main{max-width:680px;margin:0 auto;padding:14px 14px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
h1{font-size:20px;font-weight:800;margin:6px 0 10px}
h2{font-size:16px;font-weight:800;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
button{width:100%;padding:10px 14px;margin-top:8px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--teal);color:var(--teal-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
button.small{width:auto;margin:0;padding:6px 12px;font-size:13px}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.back{background:none;color:var(--teal);width:auto;padding:2px 0;margin:0 0 6px;font-weight:600}
.item{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 8px}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin-top:8px}
.kv div:nth-child(odd){color:var(--mute)}
.badge{font-size:12px;background:var(--soft);color:var(--teal);padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.st-aktif{background:#dcfce7;color:#166534}
.st-satildi,.st-kapandi{background:#fee2e2;color:#991b1b}
.st-kiralandi,.st-beklemede,.st-tapu{background:#fef3c7;color:#92400e}
.muted{color:var(--mute);font-size:14px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:18px}
.ok{color:#15803d;font-size:14px;margin-top:8px;min-height:18px}
.uid{word-break:break-all;background:var(--bg);padding:8px;border-radius:8px;font-size:13px}
@media (max-width:420px){.grid{grid-template-columns:1fr}.who{display:none}}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"><p class="muted">Yükleniyor…</p></main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyApeodpLCU6pVDAj_pY5qx-kOCHSHud-Mo",
  authDomain: "akrap-v2.firebaseapp.com",
  projectId: "akrap-v2",
  storageBucket: "akrap-v2.firebasestorage.app",
  messagingSenderId: "947705636178",
  appId: "1:947705636178:web:ee26e4f3b3f3533a76868b",
  measurementId: "G-60KNTCNS5G"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const TS = () => firebase.firestore.FieldValue.serverTimestamp();

const S = {
  ready: false, user: null, profile: null, office: null,
  flash: "", flashOk: false,
  view: "home", msg: "", msgOk: false,
  listings: [], current: null, editing: false, filterStatus: "all", q: "",
  customers: [], currentCust: null, editingCust: false, cKind: "all", cStatus: "all", cq: "",
  members: [],
  sales: [], currentSale: null, editingSale: false, sFilter: "all", sq: ""
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const phoneOk = p => { const d = String(p || "").replace(/\D/g, ""); return d.length >= 10 && d.length <= 13; };
const ROLE_LABEL = { admin: "Ofis yöneticisi", member: "Danışman" };
const AUTH_MSG = {
  "auth/invalid-credential": "E-posta veya şifre hatalı.",
  "auth/invalid-email": "E-posta adresi geçersiz.",
  "auth/too-many-requests": "Çok fazla deneme. Biraz bekleyin.",
  "auth/operation-not-allowed": "E-posta ile giriş etkin değil (Firebase ayarlarını kontrol edin)."
};
const LISTING_TYPES = ["Daire", "Villa", "Arsa", "Dükkan", "Ofis", "Diğer"];
const STATUS = { aktif: "Aktif", satildi: "Satıldı", kiralandi: "Kiralandı" };
const KIND = { alici: "Alıcı", satici: "Satıcı", kiraci: "Kiracı", ev_sahibi: "Ev sahibi" };
const CSTATUS = { aktif: "Aktif", beklemede: "Beklemede", kapandi: "Kapandı" };
const money = n => (n == null || n === "") ? "-" : Number(n).toLocaleString("tr-TR") + " ₺";
const tsNum = t => (t && t.toMillis) ? t.toMillis() : Date.now();
const parseMoney = s => { const r = String(s ?? "").trim().replace(/\./g, "").replace(/,/g, "."); return r === "" ? null : Number(r); };
const slug = s => String(s).toLowerCase()
  .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,20) || "ofis";

function isAdmin() { return !!S.profile && S.profile.role === "admin"; }
function canEdit(r) { return !!r && (r.advisor === S.user.uid || isAdmin()); }

async function loadState() {
  S.profile = null; S.office = null;
  if (!S.user) return;
  const sn = await db.collection("users").doc(S.user.uid).get();
  if (sn.exists) {
    S.profile = Object.assign({ id: S.user.uid }, sn.data());
    if (S.profile.office) {
      const o = await db.collection("offices").doc(S.profile.office).get();
      S.office = o.exists ? Object.assign({ id: o.id }, o.data()) : null;
    }
  }
}

function officeRef() { return db.collection("offices").doc(S.office.id); }

async function loadListings() {
  const sn = await officeRef().collection("listings").orderBy("createdAt", "desc").get();
  S.listings = sn.docs.map(d => Object.assign({ id: d.id }, d.data()));
}

async function loadCustomers() {
  const base = officeRef().collection("customers");
  const q = isAdmin() ? base : base.where("advisor", "==", S.user.uid);
  const sn = await q.get();
  S.customers = sn.docs.map(d => Object.assign({ id: d.id }, d.data()))
    .sort((a, b) => tsNum(b.createdAt) - tsNum(a.createdAt));
}

async function loadMembers() {
  const sn = await db.collection("users").where("office", "==", S.office.id).get();
  S.members = sn.docs.map(d => Object.assign({ uid: d.id }, d.data()))
    .sort((a, b) => (a.name || "").localeCompare(b.name || "", "tr"));
}

function memberName(uid) {
  const m = S.members.find(x => x.uid === uid);
  return m ? (m.name || m.uid) : "-";
}

function setFlash(msg, ok) { S.flash = msg; S.flashOk = !!ok; render(); }
function setMsg(msg, ok) { S.msg = msg; S.msgOk = !!ok; render(); }
function msgBlock() {
  return `<div class="ok">${S.msgOk ? esc(S.msg) : ""}</div><div class="err">${S.msgOk ? "" : esc(S.msg)}</div>`;
}

/* ---------- Giriş ve ofis ---------- */

function loginView() {
  return `<div class="card">
    <h1>Akrap'a giriş</h1>
    <label>E-posta<input id="em" type="email" autocomplete="username"></label>
    <label>Şifre<input id="pw" type="password" autocomplete="current-password"></label>
    <button onclick="doLogin()">Giriş yap</button>
    <div class="err">${esc(S.flash)}</div>
  </div>`;
}

function setupView() {
  const p = S.profile || {};
  return `<div class="card">
    <h2>Bilgilerinizi tamamlayın</h2>
    <p class="muted">Ad ve telefon numarası zorunludur.</p>
    <label>Ad soyad<input id="nm" value="${esc(p.name || "")}"></label>
    <label>Telefon<input id="ph" type="tel" placeholder="05xx xxx xx xx" value="${esc(p.phone || "")}"></label>
    <button onclick="saveProfile()">Kaydet</button>
    <div class="ok">${S.flashOk ? esc(S.flash) : ""}</div>
    <div class="err">${S.flashOk ? "" : esc(S.flash)}</div>
  </div>
  ${S.profile ? "" : newOfficeView()}
  <div class="card"><p class="muted">Mevcut bir ofise katılmak için ofis yöneticiniz sizi ekleyecek. Yöneticinize aşağıdaki kimliği verin:</p>
    <div class="uid">${esc(S.user.uid)}</div></div>
  <button class="ghost" onclick="doLogout()">Çıkış yap</button>`;
}

function newOfficeView() {
  return `<div class="card">
    <h2>Yeni ofis aç</h2>
    <p class="muted">Ofisinizi açtığınızda sistem yöneticisi onayı gerekir.</p>
    <label>Ofis adı<input id="oname" placeholder="Örn. Ertan Taştan Mülk Ofisi"></label>
    <button onclick="createOffice()">Ofis aç</button>
  </div>`;
}

function waitingView() {
  return `<div class="card">
    <h2>${esc(S.office.name || "Ofis")}</h2>
    <p class="muted">Ofisiniz sistem yöneticisi onayını bekliyor. Onaylandığında buradan devam edebilirsiniz.</p>
  </div>
  <button class="ghost" onclick="doLogout()">Çıkış yap</button>`;
}

/* ---------- Ana sayfa ---------- */

function homeView() {
  const p = S.profile;
  return `<div class="card">
    <div class="row"><h2>${esc(S.office.name)}</h2><span class="badge">${esc(ROLE_LABEL[p.role] || p.role)}</span></div>
    <p class="muted">Merhaba ${esc(p.name)} · ${esc(p.phone)}</p>
  </div>
  <div class="card"><h2>Menü</h2>
    <button onclick="goListings()">Portföy</button>
    <button onclick="goCustomers()">Müşteriler</button>
    <button onclick="goSales()">Satışlar</button>
    ${isAdmin() ? '<button onclick="goOffice()">Ofis yönetimi</button>' : ""}
  </div>
  <button class="ghost" onclick="doLogout()">Çıkış yap</button>`;
}

/* ---------- Portföy ---------- */

function listingsView() {
  const filtered = S.listings.filter(l => {
    if (S.filterStatus !== "all" && l.status !== S.filterStatus) return false;
    if (S.q) {
      const hay = [l.title, l.district, l.type, l.advisorName].join(" ").toLowerCase();
      if (!hay.includes(S.q.toLowerCase())) return false;
    }
    return true;
  });
  const items = filtered.length
    ? filtered.map(l => `<button class="item" onclick="openListing('${esc(l.id)}')">
        <div class="row"><span class="t">${esc(l.title)}</span>
          <span class="badge st-${esc(l.status)}">${esc(STATUS[l.status] || l.status)}</span></div>
        <div class="s">${esc(l.type)} · ${esc(l.district)} · ${money(l.price)}</div>
        <div class="s">Danışman: ${esc(l.advisorName || "-")}</div>
      </button>`).join("")
    : `<p class="muted">Kayıt bulunamadı.</p>`;
  return `<button class="back" onclick="goHome()">← Ana sayfa</button>
  <div class="card">
    <div class="row"><h2>Portföy (${S.listings.length})</h2>
      <button class="small" onclick="newListing()">+ Yeni</button></div>
    <div class="grid">
      <div><label>Durum<select onchange="setFilter(this.value)">
        <option value="all" ${S.filterStatus === "all" ? "selected" : ""}>Tümü</option>
        ${Object.keys(STATUS).map(k => `<option value="${k}" ${S.filterStatus === k ? "selected" : ""}>${STATUS[k]}</option>`).join("")}
      </select></label></div>
      <div><label>Ara<input value="${esc(S.q)}" oninput="setQ(this.value)" placeholder="Başlık, ilçe, tür"></label></div>
    </div>
    ${msgBlock()}
  </div>
  <div>${items}</div>`;
}

function listingDetailView() {
  const l = S.current;
  return `<button class="back" onclick="goListings()">← Portföy listesi</button>
  <div class="card">
    <div class="row"><h2>${esc(l.title)}</h2>
      <span class="badge st-${esc(l.status)}">${esc(STATUS[l.status] || l.status)}</span></div>
    <div class="kv">
      <div>Tür</div><div>${esc(l.type)}</div>
      <div>İlçe</div><div>${esc(l.district)}</div>
      <div>Fiyat</div><div>${money(l.price)}</div>
      <div>Oda</div><div>${esc(l.rooms || "-")}</div>
      <div>m²</div><div>${esc(l.m2 || "-")}</div>
      <div>Danışman</div><div>${esc(l.advisorName || "-")}</div>
    </div>
    ${l.description ? `<p style="white-space:pre-wrap">${esc(l.description)}</p>` : ""}
    ${canEdit(l)
      ? `<div class="grid"><button onclick="editListing()">Düzenle</button>
          <button class="danger" onclick="deleteListing()">Sil</button></div>`
      : `<p class="muted">Bu portföy size ait değil; yalnızca görüntüleyebilirsiniz.</p>`}
    ${msgBlock()}
  </div>`;
}

function listingFormView() {
  const l = S.editing ? S.current : {};
  const opt = (arr, val) => arr.map(v => `<option value="${esc(v)}" ${val === v ? "selected" : ""}>${esc(v)}</option>`).join("");
  return `<button class="back" onclick="${S.editing ? "backToListingDetail()" : "goListings()"}">← Geri</button>
  <div class="card">
    <h2>${S.editing ? "Portföyü düzenle" : "Yeni portföy"}</h2>
    <p class="muted"><b>*</b> ile işaretli alanlar zorunludur.</p>
    <label>Başlık *<input id="f_title" value="${esc(l.title || "")}"></label>
    <label>Tür *<select id="f_type">${opt(LISTING_TYPES, l.type || "Daire")}</select></label>
    <label>İlçe / mahalle *<input id="f_district" value="${esc(l.district || "")}"></label>
    <div class="grid">
      <label>Fiyat (₺) *<input id="f_price" inputmode="numeric" value="${esc(l.price ?? "")}"></label>
      <label>Durum *<select id="f_status">
        ${Object.keys(STATUS).map(k => `<option value="${k}" ${(l.status || "aktif") === k ? "selected" : ""}>${STATUS[k]}</option>`).join("")}
      </select></label>
    </div>
    <div class="grid">
      <label>Oda<input id="f_rooms" value="${esc(l.rooms || "")}" placeholder="2+1"></label>
      <label>m²<input id="f_m2" inputmode="numeric" value="${esc(l.m2 || "")}"></label>
    </div>
    <label>Açıklama<textarea id="f_desc">${esc(l.description || "")}</textarea></label>
    <button onclick="saveListing()">Kaydet</button>
    ${msgBlock()}
  </div>`;
}

/* ---------- Müşteriler ---------- */

function customersView() {
  const filtered = S.customers.filter(c => {
    if (S.cKind !== "all" && c.kind !== S.cKind) return false;
    if (S.cStatus !== "all" && c.status !== S.cStatus) return false;
    if (S.cq) {
      const hay = [c.name, c.phone, c.district, c.advisorName].join(" ").toLowerCase();
      if (!hay.includes(S.cq.toLowerCase())) return false;
    }
    return true;
  });
  const items = filtered.length
    ? filtered.map(c => `<button class="item" onclick="openCustomer('${esc(c.id)}')">
        <div class="row"><span class="t">${esc(c.name)}</span>
          <span class="badge st-${esc(c.status)}">${esc(CSTATUS[c.status] || c.status)}</span></div>
        <div class="s">${esc(KIND[c.kind] || c.kind)} · ${esc(c.phone)}${c.district ? " · " + esc(c.district) : ""}</div>
        <div class="s">Danışman: ${esc(c.advisorName || "-")}</div>
      </button>`).join("")
    : `<p class="muted">Kayıt bulunamadı.</p>`;
  return `<button class="back" onclick="goHome()">← Ana sayfa</button>
  <div class="card">
    <div class="row"><h2>Müşteriler (${S.customers.length})</h2>
      <button class="small" onclick="newCustomer()">+ Yeni</button></div>
    <div class="grid">
      <div><label>Tür<select onchange="setCKind(this.value)">
        <option value="all" ${S.cKind === "all" ? "selected" : ""}>Tümü</option>
        ${Object.keys(KIND).map(k => `<option value="${k}" ${S.cKind === k ? "selected" : ""}>${KIND[k]}</option>`).join("")}
      </select></label></div>
      <div><label>Durum<select onchange="setCStatus(this.value)">
        <option value="all" ${S.cStatus === "all" ? "selected" : ""}>Tümü</option>
        ${Object.keys(CSTATUS).map(k => `<option value="${k}" ${S.cStatus === k ? "selected" : ""}>${CSTATUS[k]}</option>`).join("")}
      </select></label></div>
    </div>
    <label>Ara<input value="${esc(S.cq)}" oninput="setCQ(this.value)" placeholder="Ad, telefon, ilçe"></label>
    ${msgBlock()}
  </div>
  <div>${items}</div>`;
}

function customerDetailView() {
  const c = S.currentCust;
  return `<button class="back" onclick="goCustomers()">← Müşteri listesi</button>
  <div class="card">
    <div class="row"><h2>${esc(c.name)}</h2>
      <span class="badge st-${esc(c.status)}">${esc(CSTATUS[c.status] || c.status)}</span></div>
    <div class="kv">
      <div>Telefon</div><div><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>
      <div>Tür</div><div>${esc(KIND[c.kind] || c.kind)}</div>
      <div>İlçe</div><div>${esc(c.district || "-")}</div>
      <div>Bütçe</div><div>${c.budgetMin || c.budgetMax ? money(c.budgetMin) + " – " + money(c.budgetMax) : "-"}</div>
      <div>Oda</div><div>${esc(c.rooms || "-")}</div>
      <div>Danışman</div><div>${esc(c.advisorName || "-")}</div>
    </div>
    ${c.notes ? `<p style="white-space:pre-wrap">${esc(c.notes)}</p>` : ""}
    ${canEdit(c)
      ? `<div class="grid"><button onclick="editCustomer()">Düzenle</button>
          <button class="danger" onclick="deleteCustomer()">Sil</button></div>`
      : `<p class="muted">Bu müşteri size ait değil; görüntüleme yetkiniz yok.</p>`}
    ${msgBlock()}
  </div>`;
}

function customerFormView() {
  const c = S.editingCust ? S.currentCust : {};
  const opt = (obj, val) => Object.keys(obj).map(k => `<option value="${k}" ${val === k ? "selected" : ""}>${esc(obj[k])}</option>`).join("");
  const advisorField = isAdmin()
    ? `<label>Danışman *<select id="f_advisor">
        ${S.members.map(m => `<option value="${esc(m.uid)}" ${(c.advisor || S.user.uid) === m.uid ? "selected" : ""}>${esc(m.name || m.uid)}</option>`).join("")}
       </select></label>`
    : "";
  return `<button class="back" onclick="${S.editingCust ? "backToCustomerDetail()" : "goCustomers()"}">← Geri</button>
  <div class="card">
    <h2>${S.editingCust ? "Müşteriyi düzenle" : "Yeni müşteri"}</h2>
    <p class="muted"><b>*</b> ile işaretli alanlar zorunludur.</p>
    <label>Ad soyad *<input id="c_name" value="${esc(c.name || "")}"></label>
    <label>Telefon *<input id="c_phone" type="tel" placeholder="05xx xxx xx xx" value="${esc(c.phone || "")}"></label>
    <div class="grid">
      <label>Tür *<select id="c_kind">${opt(KIND, c.kind || "alici")}</select></label>
      <label>Durum *<select id="c_status">${opt(CSTATUS, c.status || "aktif")}</select></label>
    </div>
    <label>İlçe / mahalle<input id="c_district" value="${esc(c.district || "")}"></label>
    <div class="grid">
      <label>Bütçe min (₺)<input id="c_bmin" inputmode="numeric" value="${esc(c.budgetMin ?? "")}"></label>

/* ---------- Satışlar ---------- */

const SALE_STATUS = { anlasildi: "Anlaşıldı", tapu: "Tapu aşamasında", tamamlandi: "Tamamlandı" };
const COM_STATUS = { bekliyor: "Bekliyor", tahsil: "Tahsil edildi" };
const PAY_TYPES = ["Nakit", "Banka kredisi", "Takas", "Diğer"];
const todayStr = () => new Date().toISOString().slice(0, 10);

function comOf(x) { return Math.round((Number(x.price) || 0) * (Number(x.rate) || 0) / 100); }
function myShare(x) {
  const c = comOf(x);
  if (isAdmin()) return c;
  if (x.advisor2) return x.advisor === S.user.uid || x.advisor2 === S.user.uid ? Math.round(c / 2) : 0;
  return x.advisor === S.user.uid ? c : 0;
}
function canEditSale(x) { return !!x && (x.advisor === S.user.uid || isAdmin()); }
function saleBadge(st) {
  const cls = st === "tamamlandi" ? "st-aktif" : st === "tapu" ? "st-beklemede" : "";
  return `<span class="badge ${cls}">${esc(SALE_STATUS[st] || st)}</span>`;
}

async function loadSales() {
  const base = officeRef().collection("sales");
  let docs;
  if (isAdmin()) {
    docs = (await base.get()).docs;
  } else {
    const a = await base.where("advisor", "==", S.user.uid).get();
    const b = await base.where("advisor2", "==", S.user.uid).get();
    const map = new Map();
    [...a.docs, ...b.docs].forEach(d => map.set(d.id, d));
    docs = [...map.values()];
  }
  S.sales = docs.map(d => Object.assign({ id: d.id }, d.data()))
    .sort((x, y) => String(y.date || "").localeCompare(String(x.date || "")));
}

async function goSales() {
  S.view = "sales"; S.msg = "";
  try {
    await Promise.all([loadSales(), loadListings(), loadCustomers()]);
    if (isAdmin()) await loadMembers();
  } catch (e) { setMsg("Satışlar okunamadı: " + e.message, false); return; }
  render();
}

function setSFilter(v) { S.sFilter = v; render(); }
function setSQ(v) { S.sq = v; render(); }

function salesView() {
  const mine = S.sales;
  const ym = todayStr().slice(0, 7);
  const open = mine.filter(x => x.status !== "tamamlandi").length;
  const monthCount = mine.filter(x => String(x.date || "").startsWith(ym)).length;
  const pend = mine.filter(x => x.comStatus !== "tahsil").reduce((t, x) => t + myShare(x), 0);
  const list = mine.filter(x => {
    if (S.sFilter !== "all" && x.status !== S.sFilter) return false;
    if (S.sq) {
      const hay = [x.title, x.buyer, x.advisorName].join(" ").toLowerCase();
      if (!hay.includes(S.sq.toLowerCase())) return false;
    }
    return true;
  });
  const items = list.length
    ? list.map(x => `<button class="item" onclick="openSale('${esc(x.id)}')">
        <div class="row"><span class="t">${esc(x.title)}</span>${saleBadge(x.status)}</div>
        <div class="s">${money(x.price)}${x.buyer ? " · " + esc(x.buyer) : ""} · ${esc(x.date || "")}</div>
        <div class="s">Danışman: ${esc(x.advisorName || "-")}${x.advisor2 ? " + ortak" : ""}</div>
      </button>`).join("")
    : `<p class="muted">Satış kaydı bulunamadı.</p>`;
  return `<button class="back" onclick="goHome()">← Ana sayfa</button>
  <div class="card">
    <div class="grid">
      <div><b>${mine.length}</b><div class="muted">Toplam satış</div></div>
      <div><b>${monthCount}</b><div class="muted">Bu ay</div></div>
      <div><b>${open}</b><div class="muted">Açık süreç</div></div>
      <div><b>${money(Math.round(pend))}</b><div class="muted">${isAdmin() ? "Bekleyen komisyon" : "Bekleyen payım"}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="row"><h2>Satışlar</h2><button class="small" onclick="newSale()">+ Yeni satış</button></div>
    <div class="grid">
      <div><label>Durum<select onchange="setSFilter(this.value)">
        <option value="all" ${S.sFilter === "all" ? "selected" : ""}>Tümü</option>
        ${Object.keys(SALE_STATUS).map(k => `<option value="${k}" ${S.sFilter === k ? "selected" : ""}>${SALE_STATUS[k]}</option>`).join("")}
      </select></label></div>
      <div><label>Ara<input value="${esc(S.sq)}" oninput="setSQ(this.value)" placeholder="Portföy, alıcı, danışman"></label></div>
    </div>
    ${msgBlock()}
  </div>
  <div>${items}</div>`;
}

  return `<button class="back" onclick="goSales()">← Satış listesi</button>
  <div class="card">
    <div class="row"><h2>${esc(x.title)}</h2>${saleBadge(x.status)}</div>
    <div class="kv">
      <div>Satış fiyatı</div><div>${money(x.price)}</div>
      <div>Alıcı</div><div>${esc(x.buyer || "-")}</div>
      <div>Satış tarihi</div><div>${esc(x.date || "-")}</div>
      <div>Tapu tarihi</div><div>${esc(x.tapu || "-")}</div>
      <div>Ödeme</div><div>${esc(x.pay || "-")}</div>
      <div>Komisyon oranı</div><div>%${esc(x.rate ?? 0)}</div>
      <div>Komisyon</div><div>${money(c)}${x.advisor2 ? " (her danışmana " + money(share) + ")" : ""}</div>

      <div>Danışman</div><div>${esc(x.advisorName || "-")}</div>
      <div>Ortak danışman</div><div>${x.advisor2 ? esc(memberName(x.advisor2)) : "-"}</div>

      : `<p class="muted">Bu satış size ait değil; yalnızca görüntüleyebilirsiniz.</p>`}
    ${msgBlock()}
  </div>`;
}

function saleFormView() {
  const x = S.editingSale ? S.currentSale : {};
  const opt = (arr, val) => arr.map(v => `<option value="${esc(v)}" ${val === v ? "selected" : ""}>${esc(v)}</option>`).join("");
  const listingOpts = S.listings.map(l => `<option value="${esc(l.id)}" ${x.lid === l.id ? "selected" : ""}>${esc(l.title)} · ${money(l.price)}</option>`).join("");
  const custOpts = S.customers.map(c => `<option value="${esc(c.id)}" ${x.cid === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  const partnerField = isAdmin()
    ? `<label>Ortak danışman<select id="s_adv2">
        <option value="">Yok</option>
        ${S.members.filter(m => m.uid !== (x.advisor || S.user.uid)).map(m => `<option value="${esc(m.uid)}" ${x.advisor2 === m.uid ? "selected" : ""}>${esc(m.name || m.uid)}</option>`).join("")}
      </select></label>`
    : "";

  <div class="card">

    <label>İlan (isteğe bağlı)<select id="s_lid" onchange="pickSaleListing(this.value)">
      <option value="">İlan listede yok</option>${listingOpts}</select></label>
    <label>Portföy adı *<input id="s_title" value="${esc(x.title || "")}"></label>
    <label>Alıcı (müşteri listesinden)<select id="s_cid">
      <option value="">Listede yok</option>${custOpts}</select></label>
    <label>Alıcı adı (listede yoksa)<input id="s_buyer" value="${esc(x.buyer || "")}"></label>
    <div class="grid">
      <label>Satış fiyatı (₺) *<input id="s_price" inputmode="numeric" value="${esc(x.price ?? "")}"></label>
      <label>Komisyon oranı (%)<input id="s_rate" inputmode="decimal" value="${esc(x.rate ?? 2)}"></label>
    </div>
    <div class="grid">
      <label>Satış tarihi *<input id="s_date" type="date" value="${esc(x.date || todayStr())}"></label>
      <label>Tapu tarihi<input id="s_tapu" type="date" value="${esc(x.tapu || "")}"></label>
    </div>
    <div class="grid">
      <label>Ödeme<select id="s_pay">${opt(PAY_TYPES, x.pay || "Nakit")}</select></label>
      <label>Durum<select id="s_status">
        ${Object.keys(SALE_STATUS).map(k => `<option value="${k}" ${(x.status || "anlasildi") === k ? "selected" : ""}>${SALE_STATUS[k]}</option>`).join("")}
      </select></label>
    </div>
    <div class="grid">
      <label>Komisyon durumu<select id="s_com">
        ${Object.keys(COM_STATUS).map(k => `<option value="${k}" ${(x.comStatus || "bekliyor") === k ? "selected" : ""}>${COM_STATUS[k]}</option>`).join("")}
      </select></label>
      ${partnerField}

    <label>Notlar<textarea id="s_notes">${esc(x.notes || "")}</textarea></label>
    <button onclick="saveSale()">Kaydet</button>

function pickSaleListing(lid) {
  const l = S.listings.find(x => x.id === lid);
  if (!l) return;
  $("s_title").value = l.title || "";
  $("s_price").value = l.price ?? "";
}

function newSale() {
  S.editingSale = false; S.currentSale = null; S.view = "sform"; S.msg = "";
  render();
}

function openSale(id) {
  S.currentSale = S.sales.find(x => x.id === id) || null;
  if (!S.currentSale) return setMsg("Kayıt bulunamadı.", false);
  S.view = "sdetail"; S.msg = "";
  render();
}
function backToSaleDetail() { S.view = "sdetail"; render(); }

function editSale() {
  if (!canEditSale(S.currentSale)) return setMsg("Bu satışı düzenleme yetkiniz yok.", false);
  S.editingSale = true; S.view = "sform"; S.msg = "";
  render();
}

function readSaleForm() {
  const v = id => ($(id) ? $(id).value.trim() : "");
  const cid = v("s_cid");
  const cust = S.customers.find(c => c.id === cid);
  const buyer = cust ? cust.name : v("s_buyer");
  return {
    lid: v("s_lid"),
    title: v("s_title"),
    cid: cust ? cust.id : "",
    buyer,
    price: parseMoney(v("s_price")),
    rate: Number(String(v("s_rate") || "0").replace(",", ".")) || 0,
    date: v("s_date"),
    tapu: v("s_tapu"),
    pay: v("s_pay"),
    status: v("s_status"),
    comStatus: v("s_com"),
    advisor2: $("s_adv2") ? $("s_adv2").value : "",
    notes: v("s_notes")
  };
}

async function closeListing(lid) {
  if (!lid) return "";
  try {
    await officeRef().collection("listings").doc(lid).update({ status: "satildi", closedAt: TS() });
    return "";
  } catch (e) {
    return " (İlan durumu güncellenemedi: sadece ilan sahibi veya yönetici güncelleyebilir.)";
  }
}

async function saveSale() {
  const d = readSaleForm();
  if (!d.title) return setMsg("Portföy adı zorunlu.", false);
  if (!(d.price > 0)) return setMsg("Geçerli bir satış fiyatı girin.", false);
  if (!d.date) return setMsg("Satış tarihi zorunlu.", false);
  if (!(d.rate >= 0 && d.rate <= 100)) return setMsg("Komisyon oranı 0-100 arasında olmalı.", false);
  const owner = S.editingSale ? S.currentSale.advisor : S.user.uid;
  if (d.advisor2 && d.advisor2 === owner) return setMsg("Ortak danışman, satışı yapan danışmandan farklı olmalı.", false);
  if (S.editingSale && !canEditSale(S.currentSale)) return setMsg("Bu satışı düzenleme yetkiniz yok.", false);

  const ref = officeRef().collection("sales");
  try {
    let id;
    if (S.editingSale) {
      id = S.currentSale.id;
      await ref.doc(id).update(Object.assign({}, d, { advisor2: d.advisor2 || "", updatedAt: TS() }));
    } else {
      const created = await ref.add(Object.assign({}, d, {
        advisor: S.user.uid, advisorName: S.profile.name, advisor2: d.advisor2 || "",
        createdAt: TS(), updatedAt: TS()
      }));
      id = created.id;
    }
    const warn = d.status === "tamamlandi" || d.status === "tapu" || d.status === "anlasildi" ? await closeListing(d.lid) : "";
    await loadSales();
    S.currentSale = S.sales.find(x => x.id === id) || null;
    S.view = "sdetail"; S.msg = "Satış kaydedildi." + warn; S.msgOk = !warn;
    render();
  } catch (e) {
    setMsg("Kaydedilemedi: " + e.message, false);
  }
}

async function deleteSale() {
  if (!canEditSale(S.currentSale)) return setMsg("Bu satışı silme yetkiniz yok.", false);
  if (!confirm("Bu satış kaydı silinsin mi?")) return;
  try {
    await officeRef().collection("sales").doc(S.currentSale.id).delete();
    await loadSales();
    S.currentSale = null; S.view = "sales";
    S.msg = "Satış silindi."; S.msgOk = true;
    render();
  } catch (e) { setMsg("Silinemedi: " + e.message, false); }
}


/* ---------- Üst menü ---------- */
function navHtml() {
  const ready = S.ready && S.user && S.profile && S.office && phoneOk(S.profile.phone) && S.profile.name
    && !S.office.pending && !S.office.disabled;
  if (!ready) return "";
  const sec = { home:"home", listings:"listings", detail:"listings", form:"listings",
    customers:"customers", cdetail:"customers", cform:"customers",
    sales:"sales", sdetail:"sales", sform:"sales", office:"office" }[S.view] || "home";
  const btn = (k, label, fn) => `<button class="${sec === k ? "on" : ""}" onclick="${fn}">${label}</button>`;
  return `<div class="wrap">
    <div class="hdr"><div class="brand">${esc(S.office.name)}</div>
      <div class="who">${esc(S.profile.name)} · <a href="#" onclick="doLogout();return false">Çıkış</a></div></div>
    <nav>${btn("home","Ana sayfa","goHome()")}${btn("listings","Portföy","goListings()")}${btn("customers","Müşteriler","goCustomers()")}${btn("sales","Satışlar","goSales()")}${isAdmin() ? btn("office","Ofis","goOffice()") : ""}</nav>
  </div>`;
}

/* ---------- Render ---------- */

function render() {
  $("top").innerHTML = navHtml();
  const app = $("app");
  if (!S.ready) { app.innerHTML = '<p class="muted">Yükleniyor…</p>'; return; }
  if (!S.user) { app.innerHTML = loginView(); return; }
  if (!S.profile || !phoneOk(S.profile.phone) || !S.profile.name) { app.innerHTML = setupView(); return; }
  if (!S.office) {
    app.innerHTML = `<div class="card"><p>Ofis bulunamadı. Yöneticinizle iletişime geçin.</p></div>
      <button class="ghost" onclick="doLogout()">Çıkış yap</button>`;
    return;
  }
  if (S.office.pending || S.office.disabled) { app.innerHTML = waitingView(); return; }
  const views = {
    listings: listingsView, detail: listingDetailView, form: listingFormView,
    customers: customersView, cdetail: customerDetailView, cform: customerFormView,
    office: officeView,
    sales: salesView, sdetail: saleDetailView, sform: saleFormView
  };
  app.innerHTML = (views[S.view] || homeView)();
}

/* ---------- Eylemler: giriş ve ofis ---------- */

async function doLogin() {
  const em = $("em").value.trim(), pw = $("pw").value;
  if (!em || !pw) return setFlash("E-posta ve şifre gerekli.", false);
  try { await auth.signInWithEmailAndPassword(em, pw); }
  catch (e) { setFlash(AUTH_MSG[e.code] || ("Giriş hatası: " + e.message), false); }
}
async function doLogout() { await auth.signOut(); }

async function saveProfile() {
  const nm = $("nm").value.trim(), ph = $("ph").value.trim();
  if (!nm) return setFlash("Ad soyad gerekli.", false);
  if (!phoneOk(ph)) return setFlash("Geçerli bir telefon numarası girin (örn. 05xx xxx xx xx).", false);
  try {
    const ref = db.collection("users").doc(S.user.uid);
    const sn = await ref.get();
    if (sn.exists) {
      await ref.update({ name: nm, phone: ph });
      await refresh();
      setFlash("Kaydedildi.", true);
    } else {
      S.pendingProfile = { name: nm, phone: ph };
      setFlash("Bilgiler kaydedildi. Şimdi ofisinizi açın.", true);
    }
  } catch (e) { setFlash("Kaydedilemedi: " + e.message, false); }
}

async function createOffice() {
  const oname = $("oname").value.trim();
  const nm = (S.pendingProfile && S.pendingProfile.name) || $("nm").value.trim();
  const ph = (S.pendingProfile && S.pendingProfile.phone) || $("ph").value.trim();
  if (!oname) return setFlash("Ofis adı gerekli.", false);
  if (!nm) return setFlash("Ad soyad gerekli.", false);
  if (!phoneOk(ph)) return setFlash("Geçerli bir telefon numarası girin.", false);
  const u = S.user;
  const oid = slug(oname) + "-" + Math.random().toString(36).slice(2, 6);
  try {
    await db.collection("users").doc(u.uid).set({
      office: oid, role: "admin", cid: "c" + u.uid.slice(0, 8),
      email: (u.email || "").toLowerCase(), name: nm, phone: ph
    });
    await db.collection("offices").doc(oid).set({
      name: oname, createdBy: u.uid, pending: true, disabled: true, createdAt: TS()
    });
    S.pendingProfile = null;
    await refresh();
    setFlash("Ofis açıldı, onay bekleniyor.", true);
  } catch (e) { setFlash("Ofis açılamadı: " + e.message, false); }
}

async function goOffice() {
  if (!isAdmin()) return;
  S.view = "office"; S.msg = "";
  try { await loadMembers(); } catch (e) { setMsg("Üyeler okunamadı: " + e.message, false); return; }
  render();
}

async function addMember() {
  const uid = $("add_uid").value.trim();
  if (!uid) return setMsg("Kullanıcı kimliği (UID) girin.", false);
  if (uid === S.user.uid) return setMsg("Kendinizi ekleyemezsiniz.", false);
  if (S.members.some(m => m.uid === uid)) return setMsg("Bu kullanıcı zaten ofisinizde.", false);
  try {
    await db.collection("users").doc(uid).set({
      office: S.office.id, role: "member", cid: "c" + uid.slice(0, 8),
      email: "", name: "", phone: ""
    });
    await loadMembers();
    S.msg = "Üye eklendi. Kullanıcı girişte adını ve telefonunu tamamlayacak."; S.msgOk = true;
    render();
  } catch (e) { setMsg("Üye eklenemedi: " + e.message, false); }
}

async function toggleRole(uid) {
  const m = S.members.find(x => x.uid === uid);
  if (!m) return;
  const next = m.role === "admin" ? "member" : "admin";
  if (!confirm(`${m.name || uid} ${next === "admin" ? "ofis yöneticisi" : "danışman"} yapılsın mı?`)) return;
  try {
    await db.collection("users").doc(uid).update({ role: next });
    await loadMembers();
    setMsg("Rol güncellendi.", true);
  } catch (e) { setMsg("Rol güncellenemedi: " + e.message, false); }
}

async function removeMember(uid) {
  const m = S.members.find(x => x.uid === uid);
  if (!m) return;
  if (!confirm(`${m.name || uid} ofisten çıkarılsın mı? Portföy ve müşteri kayıtları ofiste kalır.`)) return;
  try {
    await db.collection("users").doc(uid).delete();
    await loadMembers();
    setMsg("Üye ofisten çıkarıldı.", true);
  } catch (e) { setMsg("Çıkarılamadı: " + e.message, false); }
}

async function goHome() { S.view = "home"; S.msg = ""; render(); }

async function goListings() {
  S.view = "listings"; S.msg = "";
  try { await loadListings(); } catch (e) { setMsg("Portföy okunamadı: " + e.message, false); return; }
  render();
}

function setFilter(v) { S.filterStatus = v; render(); }
function setQ(v) { S.q = v; render(); }

function openListing(id) {
  S.current = S.listings.find(l => l.id === id) || null;
  if (!S.current) return setMsg("Kayıt bulunamadı.", false);
  S.view = "detail"; S.msg = "";
  render();
}
function backToListingDetail() { S.view = "detail"; render(); }

function newListing() {
  S.editing = false; S.current = null; S.view = "form"; S.msg = "";
  render();
}

function editListing() {
  if (!canEdit(S.current)) return setMsg("Bu kaydı düzenleme yetkiniz yok.", false);
  S.editing = true; S.view = "form"; S.msg = "";
  render();
}

function readListingForm() {
  const v = id => ($(id) ? $(id).value.trim() : "");
  return {
    title: v("f_title"), type: v("f_type"), district: v("f_district"),
    price: parseMoney(v("f_price")), status: v("f_status"),
    rooms: v("f_rooms"), m2: v("f_m2"), description: v("f_desc")
  };
}

async function saveListing() {
  const d = readListingForm();
  if (!d.title) return setMsg("Başlık zorunlu.", false);
  if (!d.type) return setMsg("Tür zorunlu.", false);
  if (!d.district) return setMsg("İlçe / mahalle zorunlu.", false);
  if (d.price == null || !isFinite(d.price) || d.price <= 0) return setMsg("Geçerli bir fiyat girin.", false);
  if (!STATUS[d.status]) return setMsg("Durum seçin.", false);
  const ref = officeRef().collection("listings");
  try {
    if (S.editing) {
      if (!canEdit(S.current)) return setMsg("Bu kaydı düzenleme yetkiniz yok.", false);
      await ref.doc(S.current.id).update(Object.assign(d, { updatedAt: TS() }));
      await loadListings();
      S.current = S.listings.find(l => l.id === S.current.id) || null;
      S.view = "detail"; S.msg = "Kaydedildi."; S.msgOk = true;
    } else {
      const created = await ref.add(Object.assign(d, {
        advisor: S.user.uid, advisorName: S.profile.name, createdAt: TS(), updatedAt: TS()
      }));
      await loadListings();
      S.current = S.listings.find(l => l.id === created.id) || null;
      S.view = "detail"; S.msg = "Portföy eklendi."; S.msgOk = true;
    }
    render();
  } catch (e) { setMsg("Kaydedilemedi: " + e.message, false); }
}

async function deleteListing() {
  if (!canEdit(S.current)) return setMsg("Bu kaydı silme yetkiniz yok.", false);
  if (!confirm("Bu portföy silinsin mi?")) return;
  try {
    await officeRef().collection("listings").doc(S.current.id).delete();
    await loadListings();
    S.current = null; S.view = "listings";
    S.msg = "Portföy silindi."; S.msgOk = true;
    render();
  } catch (e) { setMsg("Silinemedi: " + e.message, false); }
}

/* ---------- Eylemler: müşteri ---------- */

async function goCustomers() {
  S.view = "customers"; S.msg = "";
  try {
    await loadCustomers();
    if (isAdmin()) await loadMembers();
  } catch (e) { setMsg("Müşteriler okunamadı: " + e.message, false); return; }
  render();
}

function setCKind(v) { S.cKind = v; render(); }
function setCStatus(v) { S.cStatus = v; render(); }
function setCQ(v) { S.cq = v; render(); }

function openCustomer(id) {
  S.currentCust = S.customers.find(c => c.id === id) || null;
  if (!S.currentCust) return setMsg("Kayıt bulunamadı.", false);
  S.view = "cdetail"; S.msg = "";
  render();
}
function backToCustomerDetail() { S.view = "cdetail"; render(); }

async function newCustomer() {
  S.editingCust = false; S.currentCust = null; S.msg = "";
  if (isAdmin() && !S.members.length) { try { await loadMembers(); } catch (e) {} }
  S.view = "cform";
  render();
}

async function editCustomer() {
  if (!canEdit(S.currentCust)) return setMsg("Bu müşteriyi düzenleme yetkiniz yok.", false);
  S.editingCust = true; S.msg = "";
  if (isAdmin() && !S.members.length) { try { await loadMembers(); } catch (e) {} }
  S.view = "cform";
  render();
}

function readCustomerForm() {
  const v = id => ($(id) ? $(id).value.trim() : "");
  return {
    name: v("c_name"), phone: v("c_phone"), kind: v("c_kind"), status: v("c_status"),
    district: v("c_district"), budgetMin: parseMoney(v("c_bmin")), budgetMax: parseMoney(v("c_bmax")),
    rooms: v("c_rooms"), notes: v("c_notes")
  };
}

async function saveCustomer() {
  const d = readCustomerForm();
  if (!d.name) return setMsg("Ad soyad zorunlu.", false);
  if (!phoneOk(d.phone)) return setMsg("Geçerli bir telefon numarası girin.", false);
  if (!KIND[d.kind]) return setMsg("Tür seçin.", false);
  if (!CSTATUS[d.status]) return setMsg("Durum seçin.", false);
  if (d.budgetMin != null && d.budgetMax != null && d.budgetMin > d.budgetMax)
    return setMsg("Bütçe min, max değerinden büyük olamaz.", false);

  // Danışman seçimi: yalnızca yönetici değiştirebilir; diğerleri kendi adına kaydeder
  let advisor = S.user.uid, advisorName = S.profile.name;
  if (isAdmin() && $("f_advisor")) {
    advisor = $("f_advisor").value;
    advisorName = memberName(advisor);
  }
  const data = Object.assign(d, { advisor, advisorName });
  const ref = officeRef().collection("customers");
  try {
    if (S.editingCust) {
      if (!canEdit(S.currentCust)) return setMsg("Bu müşteriyi düzenleme yetkiniz yok.", false);
      await ref.doc(S.currentCust.id).update(Object.assign(data, { updatedAt: TS() }));
      await loadCustomers();
      S.currentCust = S.customers.find(c => c.id === S.currentCust.id) || null;
      S.view = "cdetail"; S.msg = "Kaydedildi."; S.msgOk = true;
    } else {
      const created = await ref.add(Object.assign(data, { createdAt: TS(), updatedAt: TS() }));
      await loadCustomers();
      S.currentCust = S.customers.find(c => c.id === created.id) || null;
      S.view = "cdetail"; S.msg = "Müşteri eklendi."; S.msgOk = true;
    }
    render();
  } catch (e) { setMsg("Kaydedilemedi: " + e.message, false); }
}

async function deleteCustomer() {
  if (!canEdit(S.currentCust)) return setMsg("Bu müşteriyi silme yetkiniz yok.", false);
  if (!confirm("Bu müşteri silinsin mi?")) return;
  try {
    await officeRef().collection("customers").doc(S.currentCust.id).delete();
    await loadCustomers();
    S.currentCust = null; S.view = "customers";
    S.msg = "Müşteri silindi."; S.msgOk = true;
    render();
  } catch (e) { setMsg("Silinemedi: " + e.message, false); }
}

/* ---------- Oturum ---------- */

async function refresh() {
  await loadState();
  render();
}

auth.onAuthStateChanged(async u => {
  S.user = u;
  S.ready = false; render();
  try { await loadState(); }
  catch (e) { setFlash("Veri okunamadı: " + e.message, false); }
  S.ready = true;
  render();
});
</script>
