<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akrap v2 - Bağlantı testi</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
body{font:16px system-ui,sans-serif;margin:0;padding:16px;background:#f1f5f9;color:#0f172a}
.card{background:#fff;border-radius:12px;padding:16px;max-width:480px;margin:0 auto 12px}
input{width:100%;padding:10px;margin:6px 0 12px;font:inherit;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px}
button{padding:10px 14px;font:inherit;border:0;border-radius:8px;background:#1e40af;color:#fff;cursor:pointer;margin-right:6px}
button:disabled{opacity:.5}
pre{background:#f8fafc;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;min-height:40px;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h2 style="margin-top:0">Bağlantı testi</h2>
  <div id="loginBox">
    <label>E-posta<input id="em" type="email" autocomplete="username"></label>
    <label>Şifre<input id="pw" type="password" autocomplete="current-password"></label>
    <button id="loginBtn">Giriş yap</button>
  </div>
  <div id="appBox" hidden>
    <p id="who"></p>
    <button id="testBtn">Firestore'a yaz ve oku</button>
    <button id="outBtn">Çıkış</button>
  </div>
  <pre id="log"></pre>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyApeodpLCU6pVDAj_pY5qx-kOCHSHud-Mo",
  authDomain: "akrap-v2.firebaseapp.com",
  projectId: "akrap-v2",
  storageBucket: "akrap-v2.firebasestorage.app",
  messagingSenderId: "947705636178",
  appId: "1:947705636178:web:ee26e4f3b3f3533a76868b",
  measurementId: "G-60KNTCNS5G"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const log = m => { $("log").textContent += m + "\n"; };

function showApp(u) {
  $("loginBox").hidden = !!u;
  $("appBox").hidden = !u;
  $("who").textContent = u ? "Giriş: " + u.email : "";
}
// Oturum durumu değişince (dosya/content:// adreslerinde tetiklenmeyebilir)
auth.onAuthStateChanged(u => { if (u) showApp(u); });

$("loginBtn").onclick = async () => {
  try {
    const c = await auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value);
    log("Giriş başarılı.");
    showApp(c.user);   // düğmeyi doğrudan göster
  }
  catch (e) { log("Giriş hatası: " + e.code + " " + e.message); }
};
$("outBtn").onclick = () => auth.signOut();

$("testBtn").onclick = async () => {
  try {
    const u = auth.currentUser;
    if (!u) { log("Oturum bulunamadı. Önce giriş yapın."); return; }
    const ref = db.collection("_baglanti_testi").doc(u.uid);
    await ref.set({ at: firebase.firestore.FieldValue.serverTimestamp(), email: u.email });
    const snap = await ref.get();
    log("Yazma ve okuma başarılı: " + JSON.stringify(snap.data()));
  } catch (e) { log("Firestore hatası: " + e.code + " " + e.message); }
};
</script>
</body>
</html>
